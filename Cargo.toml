[package]
name = "rcat-rs"
version = "1.1.0"
edition = "2024"
authors = ["KingAJK30 <86845258+kingAJK30@users.noreply.github.com>"]
description = "A fast, Unix-inspired recursive file concatenation tool"
license = "MPL-2.0"
repository = "https://github.com/KingAJK30/rcat"
readme = "README.md"
keywords = ["cli", "concatenate", "recursive", "utility"]
categories = ["command-line-utilities"]

[[bin]]
name = "rcat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
